{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "foldz.serviceAccountName" . }}
  labels:
    {{- include "foldz.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# foldz makes no Kubernetes API calls while it runs one replica.
automountServiceAccountToken: false
{{- end }}
