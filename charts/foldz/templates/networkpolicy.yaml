{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "foldz.fullname" . }}
  labels:
    {{- include "foldz.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "foldz.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # The API (or the auth sidecar in front of it) and ops, from anywhere.
    - ports:
        - port: {{ ternary "proxy" "api" (eq .Values.auth.mode "proxy") }}
          protocol: TCP
        - port: ops
          protocol: TCP
    {{- with .Values.networkPolicy.nmosFrom }}
    # IS-04 and IS-05 are unauthenticated, so only the listed peers.
    - from:
        {{- toYaml . | nindent 8 }}
      ports:
        - port: nmos
          protocol: TCP
    {{- end }}
{{- end }}
