# The product serves TLS itself on the API and NMOS listeners from a
# kubernetes.io/tls Secret, exposed through a LoadBalancer.
auth:
  mode: token
  token:
    existingSecret: foldz-api-token
    key: api-token
tls:
  mode: existingSecret
  existingSecret: foldz-tls
  listeners: [api, nmos]
service:
  type: LoadBalancer
api:
  allowedHosts: [foldz.example.org]
  allowedOrigins: ["https://foldz.example.org:8080"]
