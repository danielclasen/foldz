name: release-please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      HAS_RELEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Report a missing release token
        if: env.HAS_RELEASE_TOKEN != 'true'
        run: >-
          echo "::warning::RELEASE_PLEASE_TOKEN is not set. Release PRs are
          opened with GITHUB_TOKEN, so CI does not run on them and tags
          created here trigger no tag workflows."
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tags pushed by this workflow trigger no tag workflows, so publishing
  # runs here, on the release it just created.
  image:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # The image is tagged with the version the binary reports.
      - name: Check the package carries the release version
        run: grep -qx "version = \"$VERSION\"" Cargo.toml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0
          cache-from: type=gha,scope=image
      # Workflow logs are no evidence the published artefact is right.
      - name: Pull the published image and start it
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE:$VERSION"
          test "$(docker inspect -f '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")" = "$IMAGE@$DIGEST"
          docker run --rm "$IMAGE:$VERSION" --version | grep -qx "foldz $VERSION"
          docker/smoke.sh "$IMAGE:$VERSION"

  # The binary for standalone use, from the image's build stage.
  binary:
    needs: [release-please, image]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository }}
      TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - name: Check the package carries the release version
        run: grep -qx "version = \"$VERSION\"" Cargo.toml
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dist
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=image
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The asset is a second build of the image's stage; it must be the
      # binary the published image carries.
      - name: Check the binary is the published image's binary
        run: |
          id=$(docker create "$IMAGE:$VERSION")
          docker cp "$id:/usr/local/bin/foldz" published-foldz
          docker rm "$id"
          test "$(sha256sum < dist/foldz)" = "$(sha256sum < published-foldz)"
      - name: Attach the binary, its licences and their SHA-256 sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          test "$(./foldz --version)" = "foldz $VERSION"
          mv foldz "foldz-$VERSION-x86_64-linux"
          mv THIRD-PARTY.txt "foldz-$VERSION-THIRD-PARTY.txt"
          sha256sum "foldz-$VERSION-x86_64-linux" "foldz-$VERSION-THIRD-PARTY.txt" \
            > "foldz-$VERSION-SHA256SUMS"
          gh release upload --clobber "$TAG" "foldz-$VERSION-"* --repo "$GITHUB_REPOSITORY"
      # Workflow logs are no evidence the published artefact is right.
      - name: Download the attached files and check their sums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          cd published
          gh release download "$TAG" --pattern "foldz-$VERSION-*" --repo "$GITHUB_REPOSITORY"
          sha256sum -c "foldz-$VERSION-SHA256SUMS"
          chmod +x "foldz-$VERSION-x86_64-linux"
          test "$("./foldz-$VERSION-x86_64-linux" --version)" = "foldz $VERSION"
