name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILDER: ghcr.io/danielclasen/samplez-builder@sha256:92ece4452be98fff177b49fb201c8c693130c08845c42725dd5b1173d4863fba

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-
            cargo-
      - name: Format, lint and test in the builder image
        run: |
          mkdir -p .cargo-registry .cargo-git
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SAMPLEZ_REQUIRE_PATHS=avx2 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" bash -euo pipefail -c '
              cargo fmt --all --check
              cargo clippy --workspace --all-targets --locked -- -D warnings
              cargo test --workspace --locked
              cargo test --workspace --locked --release
            '
      # Saved from main only, so per-PR snapshots do not evict the main
      # cache from the shared Actions cache.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}
