name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  BUILDER: ghcr.io/danielclasen/samplez-builder@sha256:92ece4452be98fff177b49fb201c8c693130c08845c42725dd5b1173d4863fba

jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-
            cargo-
      - name: Format, lint and test in the builder image
        run: |
          mkdir -p .cargo-registry .cargo-git
          docker run --rm --user "$(id -u):$(id -g)" \
            -e SAMPLEZ_REQUIRE_PATHS=avx2 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" bash -euo pipefail -c '
              cargo fmt --all --check
              cargo clippy --workspace --all-targets --locked -- -D warnings
              # --all-targets leaves out the e2e target, which has test = false.
              cargo clippy --locked --test e2e -- -D warnings
              cargo test --workspace --locked
              cargo test --workspace --locked --release
            '
      - name: End-to-end test with SCHED_FIFO and locked memory
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --ulimit rtprio=99 --ulimit memlock=-1 \
            -e SAMPLEZ_REQUIRE_PATHS=avx2 -e SAMPLEZ_REQUIRE_RT=1 \
            -v "$PWD:/w" -v "$PWD/.cargo-registry:/usr/local/cargo/registry" \
            -v "$PWD/.cargo-git:/usr/local/cargo/git" \
            -w /w "$BUILDER" bash -euo pipefail -c '
              cargo test --locked --test e2e
              cargo test --locked --release --test e2e
            '
      # Saved from main only, so per-PR snapshots do not evict the main
      # cache from the shared Actions cache.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target
            .cargo-registry
            .cargo-git
          key: cargo-${{ hashFiles('Cargo.lock') }}-${{ env.BUILDER }}-${{ github.sha }}

  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: foldz:ci
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
      - name: Start the image and check its listeners
        run: docker/smoke.sh foldz:ci
      - name: Build the release binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dist
          outputs: type=local,dest=dist
          cache-from: type=gha,scope=image
      - name: Check the release binary runs here
        run: |
          test -s dist/THIRD-PARTY.txt
          if grep -E '&(quot|amp|lt|gt|#x[0-9a-fA-F]+);' dist/THIRD-PARTY.txt; then
            echo "::error::THIRD-PARTY.txt contains HTML entities"
            exit 1
          fi
          dist/foldz --version | grep -q '^foldz '

  # The AMWA nmos-testing node suites against the foldz image, gated by
  # tests/nmos/gate.py on tests/nmos/expected.json.
  nmos:
    runs-on: ubuntu-24.04
    env:
      NMOS_TESTING: b21639f3a187c0e027bb7894fbe0c21d22285dfb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: foldz:ci
          cache-from: type=gha,scope=image
      - name: Check out nmos-testing
        run: |
          git init -q nmos-testing
          git -C nmos-testing fetch -q --depth 1 https://github.com/AMWA-TV/nmos-testing "$NMOS_TESTING"
          git -C nmos-testing checkout -q FETCH_HEAD
      - name: Build the nmos-testing image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: nmos-testing
          load: true
          tags: nmos-testing:ci
          cache-from: type=gha,scope=nmos-testing
          cache-to: ${{ github.event_name == 'push' && 'type=gha,scope=nmos-testing,mode=max' || '' }}
      # foldz reads CLOCK_TAI, the tool computes TAI from UTC: absolute
      # activations meet only with the kernel's TAI offset set.
      - name: Set the kernel TAI offset
        run: sudo python3 tests/nmos/set-tai-offset.py 37
      - name: Run the suites
        run: tests/nmos/conformance.sh foldz:ci nmos-testing:ci nmos-results
      - name: Gate on the results
        run: |
          python3 -B -m unittest tests/nmos/test_gate.py
          python3 tests/nmos/gate.py tests/nmos/expected.json nmos-results
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nmos-testing-results
          path: nmos-results

  chart:
    runs-on: ubuntu-24.04
    env:
      HELM_VERSION: v4.2.2
      HELM_SHA256: 9adafecab4d406853bba163a70e9f104f47dbbf65ce24b7653bae7e36150bcb6
      # renovate: datasource=github-release-attachments depName=helm-unittest/helm-unittest
      HELM_UNITTEST_VERSION: v1.2.1
      HELM_UNITTEST_SHA256: 48e86ecc1467b009630e5954375e5d8494139f73b466df5fe8c04fa45b634939
      # renovate: datasource=github-release-attachments depName=yannh/kubeconform
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm, helm-unittest and kubeconform
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz -C "$bin" --strip-components=1 linux-amd64/helm
          curl -fsSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz -C "$bin" kubeconform
          # The release tarball holds plugin.yaml and the binary; unpacking it
          # into the plugin directory runs no install hook.
          curl -fsSLo helm-unittest.tgz \
            "https://github.com/helm-unittest/helm-unittest/releases/download/$HELM_UNITTEST_VERSION/helm-unittest-linux-amd64-${HELM_UNITTEST_VERSION#v}.tgz"
          echo "$HELM_UNITTEST_SHA256  helm-unittest.tgz" | sha256sum -c -
          plugins=$("$bin/helm" env HELM_PLUGINS)/helm-unittest
          mkdir -p "$plugins"
          tar -xzf helm-unittest.tgz -C "$plugins"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Lint, unit-test and validate the chart
        run: scripts/chart-test.sh

  chart-smoke:
    runs-on: ubuntu-24.04
    env:
      HELM_VERSION: v4.2.2
      HELM_SHA256: 9adafecab4d406853bba163a70e9f104f47dbbf65ce24b7653bae7e36150bcb6
      # renovate: datasource=github-release-attachments depName=kubernetes-sigs/kind
      KIND_VERSION: v0.32.0
      KIND_SHA256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
      KUBECTL_VERSION: v1.36.1
      KUBECTL_SHA256: 629d3f410e09bf49b64ae7079f7f0bda1191efed311f7d37fdbab0ad5b0ec2b7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install helm, kind and kubectl
        run: |
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          cd "$RUNNER_TEMP"
          curl -fsSLo helm.tar.gz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz -C "$bin" --strip-components=1 linux-amd64/helm
          curl -fsSLo "$bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          echo "$KIND_SHA256  $bin/kind" | sha256sum -c -
          curl -fsSLo "$bin/kubectl" "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  $bin/kubectl" | sha256sum -c -
          chmod +x "$bin/kind" "$bin/kubectl"
          echo "$bin" >> "$GITHUB_PATH"
      # The cluster comes up while the image builds; the node image is
      # the one the script pins.
      - name: Create the kind cluster in the background
        run: |
          node_image=$(sed -n 's/^node_image=//p' scripts/chart-smoke.sh)
          test -n "$node_image"
          # shellcheck disable=SC2016
          nohup bash -c 'kind create cluster --name foldz-smoke --image "$1" --wait 120s \
            > "$RUNNER_TEMP/kind.log" 2>&1; echo $? > "$RUNNER_TEMP/kind.status"' \
            _ "$node_image" > /dev/null 2>&1 &
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: foldz:ci
          cache-from: type=gha,scope=image
      - name: Install the chart into kind and check the pod and its API
        run: |
          waited=0
          # shellcheck disable=SC2016
          timeout 300 bash -c 'until [ -s "$RUNNER_TEMP/kind.status" ]; do sleep 1; done' || waited=$?
          cat "$RUNNER_TEMP/kind.log"
          if [ "$waited" != 0 ]; then
            echo "::error::the kind cluster was not created within 300 s"
            exit 1
          fi
          test "$(cat "$RUNNER_TEMP/kind.status")" = 0
          KIND_CLUSTER_EXISTS=1 KIND_CLUSTER=foldz-smoke scripts/chart-smoke.sh foldz:ci
