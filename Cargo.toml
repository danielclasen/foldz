[package]
name = "foldz"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/danielclasen/foldz"
description = "Headless broadcast audio downmix and channel matrix over MXL"
publish = false

# samplez v0.8.0: every samplez crate at the same tag.
[dependencies]
axum = "=0.8.9"
futures-util = { version = "=0.3.34", default-features = false, features = ["alloc"] }
libc = "=0.2.191"
samplez = { git = "https://github.com/danielclasen/samplez", tag = "v0.8.0" }
samplez-dsp = { git = "https://github.com/danielclasen/samplez", tag = "v0.8.0" }
samplez-mxl = { git = "https://github.com/danielclasen/samplez", tag = "v0.8.0" }
samplez-nmos = { git = "https://github.com/danielclasen/samplez", tag = "v0.8.0" }
samplez-service = { git = "https://github.com/danielclasen/samplez", tag = "v0.8.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "sync", "time"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
utoipa = "=6.0.0"

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["macros", "net", "rt", "time"] }
tower = { version = "=0.5.3", features = ["util"] }

# Runs the foldz binary against libmxl flows with SCHED_FIFO and locked
# memory: `cargo test` leaves it out, CI runs it with `--test e2e` in a
# container with rtprio and memlock limits raised.
[[test]]
name = "e2e"
harness = false
test = false
